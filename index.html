<!DOCTYPE html>
<html style="height: 100%;overflow: hidden;">
    <head>
        <title>WPFM</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="./src/0.css">
    </head>
    <body>
        <div class="boxa" id="topBar">
            <div><img src="./res/icon.png" height="100%"></div>
            <div id="notLconBar">
                <div id="titleBar">WPFM</div>
                <div id="pathBar">
                    <button class="button" id="exitBtn">退出</button>
                    <button class="button" id="pathLast">上一级</button>
                    <div id="pathShow"></div>
                </div>
            </div>
        </div>
        <div id="main">
            <div id="leftBar" class="boxa">
                <div id="fileList" >
                    <table>
                        <thead>
                            <tr>
                                <td>NO.</td>
                                <td>Name</td>
                                <td>Size</td>
                                <td>Action</td>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>  
                </div>
                <hr>
                <div>
                    <button class="button" id="pageLast">上一页</button>
                    第<select id="pageSelect"></select>页
                    <button class="button" id="pageNext">下一页</button>
                    |共<a id="pageCount"> </a>页|共有<a id="fileCount"> </a>个文件|
                    <button class="button" id="refresh">刷新</button>
                    <button class="button" id="newFolder">新建文件夹</button>
                    <button class="button" id="upload">上传</button>
                </div>
            </div>
            <div id="showBar" class="boxa">
                
            </div>
        </div>
        <script src="./src/dialog.js"></script>
        <script src="./src/display.js"></script>
        <script src="./src/get.js"></script>
        <script src="./src/main.js"></script>
    </body>
</html>
